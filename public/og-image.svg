<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0F1923"/>

  <!-- Subtle grid texture -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1B2838" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.6"/>

  <!-- Mark — large, centred -->
  <!-- Stem -->
  <line x1="430" y1="340" x2="530" y2="340" stroke="#4A6070" stroke-width="8" stroke-linecap="round"/>
  <!-- Chosen path: bold teal -->
  <line x1="530" y1="340" x2="660" y2="230" stroke="#00D4AA" stroke-width="11" stroke-linecap="round"/>
  <!-- Dot -->
  <circle cx="660" cy="230" r="16" fill="#00D4AA"/>
  <!-- Ghost path -->
  <line x1="530" y1="340" x2="660" y2="340" stroke="#2A3A4A" stroke-width="5" stroke-linecap="round"/>

  <!-- Wordmark -->
  <text x="700" y="310"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="88"
    font-weight="500"
    fill="#00D4AA"
    letter-spacing="-2">FORE</text>
  <text x="700" y="400"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="88"
    font-weight="300"
    fill="#ffffff"
    opacity="0.55"
    letter-spacing="-2">SIGHT</text>

  <!-- Tagline -->
  <text x="700" y="445"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="18"
    font-weight="400"
    fill="#4A6070"
    letter-spacing="3">SEE WHAT HAPPENS BEFORE YOU DECIDE</text>
</svg>
