<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 48" width="280" height="48">
  <!-- Mark -->
  <!-- Stem -->
  <line x1="8" y1="28" x2="22" y2="28" stroke="#4A6070" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Chosen path: bold teal, breaks up-right -->
  <line x1="22" y1="28" x2="38" y2="14" stroke="#00D4AA" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Dot -->
  <circle cx="38" cy="14" r="4.5" fill="#00D4AA"/>
  <!-- Ghost path -->
  <line x1="22" y1="28" x2="38" y2="28" stroke="#2A3A4A" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Divider -->
  <line x1="52" y1="10" x2="52" y2="38" stroke="#2A3A4A" stroke-width="1"/>

  <!-- Wordmark: FORE (teal, medium) -->
  <text x="62" y="33"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="22"
    font-weight="500"
    fill="#00D4AA"
    letter-spacing="-0.3">FORE</text>

  <!-- Wordmark: SIGHT (light, muted white) -->
  <text x="116" y="33"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="22"
    font-weight="300"
    fill="#ffffff"
    opacity="0.65"
    letter-spacing="-0.3">SIGHT</text>
</svg>
